[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Match the IDL program name and address so `anchor.workspace.tuktukEscrow` resolves
# IDL `target/idl/tuktuk_escrow.json` has address "C3PV8WPsjiRENFpQmh48ZeGrL3cCzJ23LRD82jCUVV2r"
tuktuk_escrow = "C3PV8WPsjiRENFpQmh48ZeGrL3cCzJ23LRD82jCUVV2r"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
cron = "yarn run ts-node cron/cron.ts --cronName tuktuk-counter-cron --queueName tuktuk-counter --walletPath ~/.config/solana/id.json --rpcUrl https://api.devnet.solana.com"
